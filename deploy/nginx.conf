# =============================================================================
# ZeroClaw Nginx Reverse Proxy — Template
# =============================================================================
#
# Replace every occurrence of YOUR_DOMAIN with your actual domain name
# (e.g. agent.example.com).
#
# SSL certificates:
#   If you use certbot, it will auto-configure the ssl_certificate and
#   ssl_certificate_key paths for you. The paths below assume the default
#   Let's Encrypt directory layout.
#
#   Quick start:
#     sudo certbot --nginx -d YOUR_DOMAIN
#
# =============================================================================

# --- HTTP: redirect everything to HTTPS ---
server {
    listen       80;
    listen       [::]:80;
    server_name  YOUR_DOMAIN;

    return 301 https://$host$request_uri;
}

# --- HTTPS: reverse proxy to ZeroClaw ---
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name  YOUR_DOMAIN;

    # ----- SSL certificates (Let's Encrypt / certbot default paths) -----
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ----- SSL settings -----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ----- Security headers -----
    add_header X-Frame-Options        "DENY"                              always;
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection       "1; mode=block"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;

    # ----- Client body size -----
    client_max_body_size 10m;

    # ----- Proxy timeouts -----
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;

    # ----- Main application -----
    location / {
        proxy_pass http://127.0.0.1:42617;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- WebSocket endpoint -----
    location /ws {
        proxy_pass http://127.0.0.1:42617/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}
