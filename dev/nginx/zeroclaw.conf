# Nginx Reverse Proxy 配置
# /etc/nginx/sites-available/zeroclaw.conf
# 用於保護 Zeroclaw API 不直接暴露在公開網路

# ===== 上游服務 =====
upstream zeroclaw_api {
    # 內部 Zeroclaw 服務
    server 127.0.0.1:42617 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ===== 速率限制 =====
# 按 IP 地址限制請求速率
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pair_limit:10m rate=1r/s;

# ===== 地理位置限制（可選）=====
geo $country {
    default ZZ;
    
    # ✅ 允許訪問的國家代碼（ISO 3166-1 alpha-2）
    include /etc/nginx/geo-allowed-countries.conf;
}

# ===== HTTP → HTTPS 重定向 =====
server {
    listen 80;
    server_name api.zeroclaw.example.com;
    
    return 301 https://$server_name$request_uri;
}

# ===== HTTPS 安全服務 =====
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    
    server_name api.zeroclaw.example.com;
    
    # ============================================
    # 1️⃣ SSL/TLS 安全配置
    # ============================================
    
    # 證書路徑（使用 Let's Encrypt）
    ssl_certificate /etc/letsencrypt/live/api.zeroclaw.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zeroclaw.example.com/privkey.pem;
    
    # 現代安全的 TLS 版本
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    
    # HSTS（強制 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # SSL 優化
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # ============================================
    # 2️⃣ 安全頭部
    # ============================================
    
    # 防止 XSS
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'unsafe-inline';" always;
    
    # 隱藏 nginx 版本
    server_tokens off;
    
    # ============================================
    # 3️⃣ 速率限制
    # ============================================
    
    # API 端點速率限制
    location ~ ^/api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;  # Too Many Requests
        
        # 地理位置檢查
        if ($country = "ZZ") {
            return 403;  # Forbidden
        }
        
        # 方法限制（只允許 GET, POST, PUT, DELETE）
        limit_except GET POST PUT DELETE {
            deny all;
        }
        
        # 代理到上游
        proxy_pass http://zeroclaw_api;
        proxy_http_version 1.1;
        
        # ====================================
        # 4️⃣ 代理頭部
        # ====================================
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "upgrade";
        
        # 防止 CONNECT 隧道濫用
        proxy_set_header Proxy "";
        
        # 請求審計日誌
        access_log /var/log/nginx/zeroclaw-api-access.log zeroclaw_api_log;
        error_log /var/log/nginx/zeroclaw-api-error.log warn;
    }
    
    # 配對端點（單獨限制）
    location = /pair {
        limit_req zone=pair_limit burst=2 nodelay;
        
        proxy_pass http://zeroclaw_api;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket 支援
    location = /ws {
        proxy_pass http://zeroclaw_api;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 超時
        proxy_read_timeout 86400;
    }
    
    # ============================================
    # 5️⃣ 超時設置（防止慢速攻擊）
    # ============================================
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s 30s;
    send_timeout 10s;
    
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    
    # ============================================
    # 6️⃣ 請求大小限制
    # ============================================
    client_max_body_size 64k;
    
    # ============================================
    # 7️⃣ 健康檢查端點
    # ============================================
    location = /health {
        access_log off;
        proxy_pass http://zeroclaw_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # ============================================
    # 8️⃣ 根路徑
    # ============================================
    location / {
        return 404;
    }
    
    # ============================================
    # 9️⃣ 監控和調試（需密鑰）
    # ============================================
    location /nginx-admin/ {
        # 僅允許內部 IP
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        
        stub_status on;
    }
}

# ===== 日誌格式定義 =====
log_format zeroclaw_api_log 
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct="$upstream_connect_time" '
    'uht="$upstream_header_time" urt="$upstream_response_time" '
    'auth=$http_authorization country=$country';
